# Built-in notification template examples used for template preview.
# These are platform-wide static samples; they are not persisted in the database.
# The loader encodes the nested `payload` object as a JSON string at startup.
- name: "Default Firing Example"
  isDefault: true
  payload:
    status: "firing"
    receiverName: "ops-team"
    commonLabels:
      alertname: "HighCPUUsage"
      instance: "web-server-01"
      severity: "critical"
      env: "production"
    commonAnnotations:
      summary: "CPU usage is above 90%"
      description: "The CPU usage on web-server-01 has been above 90% for more than 5 minutes."
      runbook_url: "https://runbooks.example.com/high-cpu"
    groupLabels:
      alertname: "HighCPUUsage"
    externalURL: "http://localhost:3000"
    alerts:
      - status: "firing"
        labels:
          alertname: "HighCPUUsage"
          instance: "web-server-01"
          severity: "critical"
          env: "production"
        annotations:
          summary: "CPU usage is above 90%"
          description: "The CPU usage on web-server-01 has been above 90% for more than 5 minutes."
        startsAt: "2024-01-15T10:00:00Z"
        endsAt: "0001-01-01T00:00:00Z"
        generatorURL: "http://localhost:3000/alerting/rules/1"

- name: "Default Resolved Example"
  isDefault: false
  payload:
    status: "resolved"
    receiverName: "ops-team"
    commonLabels:
      alertname: "HighCPUUsage"
      instance: "web-server-01"
      severity: "critical"
      env: "production"
    commonAnnotations:
      summary: "CPU usage is above 90%"
      description: "The CPU usage on web-server-01 has been above 90% for more than 5 minutes."
      runbook_url: "https://runbooks.example.com/high-cpu"
    groupLabels:
      alertname: "HighCPUUsage"
    externalURL: "http://localhost:3000"
    alerts:
      - status: "resolved"
        labels:
          alertname: "HighCPUUsage"
          instance: "web-server-01"
          severity: "critical"
          env: "production"
        annotations:
          summary: "CPU usage is above 90%"
          description: "The CPU usage on web-server-01 has been above 90% for more than 5 minutes."
        startsAt: "2024-01-15T10:00:00Z"
        endsAt: "2024-01-15T10:30:00Z"
        generatorURL: "http://localhost:3000/alerting/rules/1"
