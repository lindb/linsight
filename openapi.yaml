          $ref: '#/components/responses/NotFound'
    delete:
      tags: [NotificationTemplates]
      summary: Delete notification template by UID (Editor)
      description: Delete a notification template by UID. Requires Editor role.
      parameters:
        - $ref: '#/components/parameters/UIDPath'
      responses:
        '200':
          description: Notification template deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ─── Components ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: linsight-session

  parameters:
    UIDPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier

  responses:
    BadRequest:
      description: Bad request – validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized – not logged in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden – insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Shared ──────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required: [error]

    BaseModel:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp in milliseconds
        updatedAt:
          type: integer
          format: int64
          description: Last update timestamp in milliseconds

    PagingParam:
      type: object
      properties:
        offset:
          type: integer
          default: 0
          description: Number of records to skip
        limit:
          type: integer
          default: 20
          description: Maximum number of records to return

    RoleType:
      type: string
      description: User role in an organization
      enum: [Lin, Admin, Editor, Viewer, Anonymous]

    PermissionType:
      type: string
      description: Team member permission
      enum: [Unknown, Member, Admin]

    Ownership:
      type: integer
      description: "Ownership filter: 0=Any, 1=Mine, 2=Shared"
      enum: [0, 1, 2]

    # ── Auth / User ─────────────────────────────────────────────────────────────
    LoginUser:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Login username
        password:
          type: string
          format: password
          description: Login password

    User:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            userName:
              type: string
            email:
              type: string
              format: email
            isDisabled:
              type: boolean

    CreateUserRequest:
      type: object
      required: [userName, email, password]
      properties:
        name:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Preference:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            homePage:
              type: string
            theme:
              type: string
              enum: [light, dark]
              default: light
            collapsed:
              type: boolean
              default: true
            locale:
              type: string

    SignedUser:
      type: object
      properties:
        uid:
          type: string
        userName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        isDisabled:
          type: boolean
        org:
          $ref: '#/components/schemas/Org'
        role:
          $ref: '#/components/schemas/RoleType'
        preference:
          $ref: '#/components/schemas/Preference'

    ChangeUserPassword:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    ResetUserPassword:
      type: object
      required: [userUid, password]
      properties:
        userUid:
          type: string
        password:
          type: string
          format: password

    UserOrgInfo:
      type: object
      properties:
        userUid:
          type: string
        orgUid:
          type: string
        orgName:
          type: string
        role:
          $ref: '#/components/schemas/RoleType'

    UserListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/User'

    # ── Org ─────────────────────────────────────────────────────────────────────
    Org:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string

    OrgUserInfo:
      type: object
      properties:
        userUid:
          type: string
        userName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    OrgListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/Org'

    # ── Team ────────────────────────────────────────────────────────────────────
    Team:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            email:
              type: string
              format: email

    AddTeamMember:
      type: object
      required: [userUids, permission]
      properties:
        userUids:
          type: array
          items:
            type: string
        permission:
          $ref: '#/components/schemas/PermissionType'

    UpdateTeamMember:
      type: object
      required: [userUid, permission]
      properties:
        userUid:
          type: string
        permission:
          $ref: '#/components/schemas/PermissionType'

    RemoveTeamMember:
      type: object
      required: [userUids]
      properties:
        userUids:
          type: array
          items:
            type: string

    TeamMemberInfo:
      type: object
      properties:
        userUid:
          type: string
        name:
          type: string
        userName:
          type: string
        permission:
          $ref: '#/components/schemas/PermissionType'

    TeamListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/Team'

    # ── Menu ────────────────────────────────────────────────────────────────────
    Menu:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            label:
              type: string
            path:
              type: string
            icon:
              type: string
            page:
              type: string
            pageConfig:
              type: object
              additionalProperties: true
              description: Page configuration as arbitrary JSON
            role:
              $ref: '#/components/schemas/RoleType'
            order:
              type: integer
            parentUID:
              type: string
            children:
              type: array
              items:
                $ref: '#/components/schemas/Menu'

    OrgMenuInfo:
      type: object
      required: [role]
      properties:
        menuUid:
          type: string
        role:
          $ref: '#/components/schemas/RoleType'

    # ── Datasource ──────────────────────────────────────────────────────────────
    Datasource:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            type:
              type: string
              enum: [lindb, lingo]
              description: Datasource type
            category:
              type: string
              enum: [Metric, Log, Trace]
              description: Data category
            url:
              type: string
              format: uri
            timeZone:
              type: string
            config:
              type: object
              additionalProperties: true
              description: Datasource-specific configuration as JSON
            isDefault:
              type: boolean

    # ── Dashboard ───────────────────────────────────────────────────────────────
    Dashboard:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            title:
              type: string
            description:
              type: string
            integration:
              type: string
            version:
              type: integer
            tags:
              type: array
              items:
                type: string
            isStarred:
              type: boolean

    DashboardMeta:
      type: object
      properties:
        canEdit:
          type: boolean
        provisioned:
          type: boolean

    DashboardDetail:
      type: object
      description: Dashboard with its JSON config and metadata
      properties:
        dashboard:
          type: object
          additionalProperties: true
          description: Full dashboard configuration JSON
        meta:
          $ref: '#/components/schemas/DashboardMeta'

    DashboardVersion:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            dashboardUID:
              type: string
            version:
              type: integer
            message:
              type: string
            config:
              type: object
              additionalProperties: true
              description: Dashboard configuration snapshot as JSON

    SaveDashboardRequest:
      type: object
      properties:
        dashboard:
          type: object
          additionalProperties: true
          description: Full dashboard configuration JSON
        message:
          type: string
          description: Optional commit message for version history

    DashboardListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/Dashboard'

    # ── Chart ───────────────────────────────────────────────────────────────────
    Chart:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            title:
              type: string
            description:
              type: string
            integration:
              type: string
            type:
              type: string
              description: Chart visualization type (e.g. timeseries, bar, etc.)
            version:
              type: integer
            model:
              type: object
              additionalProperties: true
              description: Chart model/config as JSON
            isStarred:
              type: boolean

    ChartInfo:
      type: object
      properties:
        uid:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        integration:
          type: string
        dashboards:
          type: integer
          description: Number of dashboards referencing this chart
        model:
          type: object
          additionalProperties: true

    ChartListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/ChartInfo'

    # ── Query ───────────────────────────────────────────────────────────────────
    QueryRequest:
      type: object
      properties:
        range:
          $ref: '#/components/schemas/TimeRange'
        queries:
          type: array
          items:
            $ref: '#/components/schemas/Query'

    TimeRange:
      type: object
      properties:
        start:
          type: integer
          format: int64
          description: Start time in milliseconds since epoch
        end:
          type: integer
          format: int64
          description: End time in milliseconds since epoch

    Query:
      type: object
      required: [datasource]
      properties:
        datasource:
          $ref: '#/components/schemas/TargetDatasource'
        params:
          type: object
          additionalProperties: true
          description: Query parameters specific to the datasource
        refId:
          type: string
          description: Reference ID for correlating results

    TargetDatasource:
      type: object
      required: [uid]
      properties:
        uid:
          type: string
          description: Datasource UID to query

    QueryResponse:
      type: object
      properties:
        results:
          type: object
          additionalProperties: true
          description: Query results keyed by refId

    # ── Integration ─────────────────────────────────────────────────────────────
    Integration:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            category:
              type: string
            title:
              type: string
            desc:
              type: string
            icon:
              type: string
            docUrl:
              type: string
              format: uri

    # ── Boot ────────────────────────────────────────────────────────────────────
    BootData:
      type: object
      properties:
        home:
          type: string
          description: Home page path
        user:
          $ref: '#/components/schemas/SignedUser'
        navTree:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
          description: Navigation menu tree for current org
        datasources:
          type: array
          items:
            $ref: '#/components/schemas/Datasource'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/Integration'

    # ── Alerting shared ──────────────────────────────────────────────────────────
    AlertEventState:
      type: integer
      description: "Alert event lifecycle state: 1=Pending, 2=Firing, 3=Resolved, 4=NoData, 5=Error"
      enum: [1, 2, 3, 4, 5]

    MatchType:
      type: string
      description: "Label matcher operator"
      enum: ["=", "!=", "=~", "!~"]

    TemplateType:
      type: string
      description: "Notification template type"
      enum: [title, body, html]

    LabelMatcher:
      type: object
      required: [name, value, type]
      properties:
        name:
          type: string
          description: Label key to match
        value:
          type: string
          description: Match value or regex pattern
        type:
          $ref: '#/components/schemas/MatchType'

    # ── Alert Rule ───────────────────────────────────────────────────────────────
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            title:
              type: string
            integration:
              type: string
            version:
              type: integer
            state:
              type: integer
              description: "Rule state: 1=Enable, 2=Running, 3=Firing, 4=Pause, 5=Delete"
              enum: [1, 2, 3, 4, 5]
            interval:
              type: integer
              format: int64
              description: Evaluation interval in nanoseconds
            for:
              type: integer
              format: int64
              description: Duration condition must hold before firing (nanoseconds). 0 = fire immediately.
            data:
              type: object
              additionalProperties: true
              description: Data query configuration as JSON
            conditions:
              type: array
              description: Alert condition expressions
              items:
                $ref: '#/components/schemas/AlertCondition'
            labels:
              type: object
              additionalProperties:
                type: string
              description: Static labels attached to all alert events from this rule
            annotations:
              type: object
              additionalProperties:
                type: string
              description: Go-template annotations (e.g. summary, description)

    AlertCondition:
      type: object
      properties:
        severity:
          type: integer
          description: "1=Alert, 2=Warning"
          enum: [1, 2]
        expr:
          type: string
          description: Boolean expression string evaluated by the expr engine

    AlertRuleListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'

    # ── Alert Event ──────────────────────────────────────────────────────────────
    AlertEvent:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            ruleUID:
              type: string
            ruleTitle:
              type: string
            fingerprint:
              type: string
              description: FNV-64a hash of the label set; uniquely identifies an alert instance
            state:
              $ref: '#/components/schemas/AlertEventState'
            labels:
              type: object
              additionalProperties:
                type: string
              description: Complete label set (rule labels + series tags + system labels)
            annotations:
              type: object
              additionalProperties:
                type: string
              description: Rendered annotations
            value:
              type: number
              format: double
              description: Metric value that triggered the alert
            startsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the alert first became active (Firing)
            endsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the alert resolved; 0 if still active
            pendingSince:
              type: integer
              format: int64
              description: Unix milliseconds when the condition first became true
            notifiedAt:
              type: integer
              format: int64
              description: Unix milliseconds of the last notification sent
            generatorURL:
              type: string
              description: URL linking back to the triggering query

    AlertEventListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvent'

    # ── Alert Route ──────────────────────────────────────────────────────────────
    AlertRoute:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            parentUID:
              type: string
              description: UID of the parent route node; empty for root routes
            matchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: All matchers must match for this route to apply
            receiverUID:
              type: string
              description: UID of the receiver to send notifications to
            continue:
              type: boolean
              description: If true, continue matching sibling routes after this one matches
            groupBy:
              type: array
              items:
                type: string
              description: Label names used to group alerts into notification batches
            groupWait:
              type: integer
              format: int64
              description: Wait duration (nanoseconds) before sending the first notification for a new group. Default 30s.
            groupInterval:
              type: integer
              format: int64
              description: Wait duration (nanoseconds) before sending a notification for a group with new alerts. Default 5m.
            repeatInterval:
              type: integer
              format: int64
              description: Wait duration (nanoseconds) before re-sending a notification for unchanged alerts. Default 4h.
            sortOrder:
              type: integer
              description: Route evaluation priority (lower = higher priority)

    AlertRouteListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        routes:
          type: array
          items:
            $ref: '#/components/schemas/AlertRoute'

    # ── Alert Receiver ───────────────────────────────────────────────────────────
    ReceiverChannel:
      type: object
      required: [type, enabled]
      properties:
        type:
          type: string
          description: Channel type
          enum: [Slack, Email, Webhook]
        config:
          type: object
          additionalProperties: true
          description: Channel-specific configuration as JSON (e.g. channel name for Slack, addresses for Email)
        enabled:
          type: boolean
          description: Whether this channel is active

    AlertReceiver:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            channels:
              type: array
              items:
                $ref: '#/components/schemas/ReceiverChannel'
              description: One or more notification channels sent simultaneously
            templateUID:
              type: string
              description: Optional UID of a NotificationTemplate to use for rendering

    AlertReceiverListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        receivers:
          type: array
          items:
            $ref: '#/components/schemas/AlertReceiver'

    # ── Alert Silence ────────────────────────────────────────────────────────────
    AlertSilence:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [matchers, startsAt, endsAt, comment]
          properties:
            uid:
              type: string
            matchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: All matchers must match for an alert to be silenced
            startsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the silence begins
            endsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the silence expires
            createdByName:
              type: string
              description: Name of the user who created this silence
            comment:
              type: string
              description: Reason for the silence (required)

    AlertSilenceListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        silences:
          type: array
          items:
            $ref: '#/components/schemas/AlertSilence'

    # ── Alert Inhibit Rule ───────────────────────────────────────────────────────
    AlertInhibitRule:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            sourceMatchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: Matchers that identify the source (triggering) alert
            targetMatchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: Matchers that identify the target (suppressed) alert
            equalLabels:
              type: array
              items:
                type: string
              description: Source and target alerts must share the same values for these labels
            enabled:
              type: boolean

    AlertInhibitRuleListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AlertInhibitRule'

    # ── Notification Template ────────────────────────────────────────────────────
    NotificationTemplate:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [name, type, template]
          properties:
            uid:
              type: string
            name:
              type: string
            type:
              $ref: '#/components/schemas/TemplateType'
            template:
              type: string
              description: |
                Go template string. Available variables:
                  .Alerts, .FiringAlerts, .ResolvedAlerts – alert event lists
                  .CommonLabels, .CommonAnnotations – shared label/annotation maps
                  .GroupLabels – labels used to form this notification group
                  .ReceiverName – name of the target receiver
                  .Status – "firing" or "resolved"
                  .ExternalURL – base URL for generating links

    NotificationTemplateListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        templates:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplate'

    # ── Notification Setting ─────────────────────────────────────────────────────
    NotificationSetting:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              description: Channel type identifier (e.g. Slack, Email)
            config:
              type: object
              additionalProperties: true
              description: Channel-specific global configuration as JSON (e.g. Slack bot token, SMTP credentials)
