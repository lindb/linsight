      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertInhibitRule'
      responses:
        '200':
          description: Alert inhibit rule updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
