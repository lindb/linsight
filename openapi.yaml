  # ── AI: Chat ──────────────────────────────────────────────────────────────
  /api/v1/ai/chat:
    post:
      tags: [AIChat]
      summary: Start a new conversation turn (SSE)
      description: |
        Sends a user message to the AI Agent and receives a streaming SSE response.
        The response is a series of `data: {...}\n\n` frames, each containing an AGUIEvent JSON object.
        Event sequence: `RUN_STARTED` → `TEXT_MESSAGE_START` / `TEXT_MESSAGE_CONTENT` / `TEXT_MESSAGE_END`
        → `TOOL_CALL_START` / `TOOL_CALL_ARGS` / `TOOL_CALL_END` / `TOOL_CALL_RESULT` (repeated per tool)
        → `RUN_FINISHED` (or `RUN_ERROR` on failure).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of AG-UI agent events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AGUIEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/conversations/{uid}/chat:
    post:
      tags: [AIChat]
      summary: Continue an existing conversation turn (SSE)
      description: |
        Appends a user message to an existing conversation and streams the agent's response.
        Same AG-UI event format as `POST /ai/chat`.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: UID of the existing conversation to continue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of AG-UI agent events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AGUIEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

