  /api/v1/alerting/templates/preview:
    post:
      tags: [NotificationTemplates]
      summary: Preview notification template (Editor)
      description: >
        Render a template string against notification data and return the result. Requires Editor role.
        When payload is omitted, the org's default NotificationTemplateExample is used automatically;
        if no default example has been configured, hardcoded sample data (firing / HighCPUUsage) is used as fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
                  description: Go template string to render. Org-level {{define}} blocks are available via {{template "NAME" .}}.
                payload:
                  description: |
                    Optional render context. Accepts two JSON shapes:
                    - Object: a full or partial NotificationData (`{"status":"firing","alerts":[...], ...}`).
                      FiringAlerts/ResolvedAlerts are auto-derived from Alerts when not provided.
                    - Array: a raw `[]AlertEvent` list (`[{"ruleTitle":"...","state":2,...}]`).
                      Status, FiringAlerts, ResolvedAlerts, and CommonLabels are all auto-derived.
                    When omitted, the org's default NotificationTemplateExample payload is used;
                    falls back to hardcoded sample data if no default example exists.
                  oneOf:
                    - type: object
                      additionalProperties: true
                      description: NotificationData object (full or partial).
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                      description: Array of AlertEvent objects.
      responses:
        '200':
          description: Rendered template output
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerting/templates/definitions:
    get:
      tags: [NotificationTemplates]
      summary: List all named template definitions (Viewer)
      description: |
        Parses all org-level notification templates and returns a deduplicated list of
        every `{{define "NAME"}}` block. The `name` field can be used as the value for
        per-channel fields (`title`, `body`, `subject`, `content`) so that the alert
        engine resolves the block by name at dispatch time. Requires Viewer role.
      responses:
        '200':
          description: List of named template definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: The {{define}} block name
                    content:
                      type: string
                      description: Reconstructed template body (from AST)
        '403':
          $ref: '#/components/responses/Forbidden'

