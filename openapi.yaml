    get:
      tags: [AlertRoutes]
      summary: Search alert routes (Viewer)
      description: Search route nodes by name with pagination. Requires Viewer role.
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
