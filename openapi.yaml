        '404':
          $ref: '#/components/responses/NotFound'

  # ── AI: Model CRUD ─────────────────────────────────────────────────────────
  /api/v1/ai/models:
    get:
      tags: [AISettings]
      summary: List all named model configurations for the org
      responses:
        '200':
          description: List of model configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [AISettings]
      summary: Create a new named model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '200':
          description: UID of the created model
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/models/default:
    get:
      tags: [AISettings]
      summary: Get the default model for the org (fixed mode)
      responses:
        '200':
          description: Default model configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/models/{uid}:
    get:
      tags: [AISettings]
      summary: Get a single model configuration by UID
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [AISettings]
      summary: Update an existing model configuration
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [AISettings]
      summary: Delete a model configuration by UID
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/models/{uid}/default:
    put:
      tags: [AISettings]
      summary: Set this model as the default for the org (fixed mode)
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── AI: Model Routing Config ───────────────────────────────────────────────
  /api/v1/ai/settings/model-routing:
    get:
      tags: [AISettings]
      summary: Get the per-org model routing strategy
      responses:
        '200':
          description: Current routing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOrgModelConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [AISettings]
      summary: Save the per-org model routing strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOrgModelConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── AI: MCP Server Settings ────────────────────────────────────────────────
  /api/v1/ai/settings/mcp:
    get:
      tags: [AISettings]
      summary: List all MCP server configurations for the org
      responses:
        '200':
          description: List of MCP server configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentMCPServer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [AISettings]
      summary: Add an MCP server configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMCPServerRequest'
      responses:
        '200':
          description: UID of the created MCP server
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ai/settings/mcp/{uid}:
    delete:
      tags: [AISettings]
      summary: Delete an MCP server configuration
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ─── Components ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: linsight-session

  parameters:
    UIDPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier

  responses:
    BadRequest:
      description: Bad request – validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized – not logged in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden – insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Shared ──────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required: [error]

    BaseModel:
      type: object
      properties:
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp in milliseconds
        updatedAt:
          type: integer
          format: int64
          description: Last update timestamp in milliseconds

    PagingParam:
      type: object
      properties:
        offset:
          type: integer
          default: 0
          description: Number of records to skip
        limit:
          type: integer
          default: 20
          description: Maximum number of records to return

    RoleType:
      type: string
      description: User role in an organization
      enum: [Lin, Admin, Editor, Viewer, Anonymous]

    PermissionType:
      type: string
      description: Team member permission
      enum: [Unknown, Member, Admin]

    Ownership:
      type: integer
      description: "Ownership filter: 0=Any, 1=Mine, 2=Shared"
      enum: [0, 1, 2]

    # ── Auth / User ─────────────────────────────────────────────────────────────
    LoginUser:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Login username
        password:
          type: string
          format: password
          description: Login password

    User:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            userName:
              type: string
            email:
              type: string
              format: email
            isDisabled:
              type: boolean

    CreateUserRequest:
      type: object
      required: [userName, email, password]
      properties:
        name:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Preference:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            homePage:
              type: string
            theme:
              type: string
              enum: [light, dark]
              default: light
            collapsed:
              type: boolean
              default: true
            locale:
              type: string

    SignedUser:
      type: object
      properties:
        uid:
          type: string
        userName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        isDisabled:
          type: boolean
        org:
          $ref: '#/components/schemas/Org'
        role:
          $ref: '#/components/schemas/RoleType'
        preference:
          $ref: '#/components/schemas/Preference'

    ChangeUserPassword:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    ResetUserPassword:
      type: object
      required: [userUid, password]
      properties:
        userUid:
          type: string
        password:
          type: string
          format: password

    UserOrgInfo:
      type: object
      properties:
        userUid:
          type: string
        orgUid:
          type: string
        orgName:
          type: string
        role:
          $ref: '#/components/schemas/RoleType'

    UserListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/User'

    # ── Org ─────────────────────────────────────────────────────────────────────
    Org:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string

    OrgUserInfo:
      type: object
      properties:
        userUid:
          type: string
        userName:
          type: string
        name:
          type: string
        email:
          type: string
          format: email

    OrgListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/Org'

    # ── Team ────────────────────────────────────────────────────────────────────
    Team:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            email:
              type: string
              format: email

    AddTeamMember:
      type: object
      required: [userUids, permission]
      properties:
        userUids:
          type: array
          items:
            type: string
        permission:
          $ref: '#/components/schemas/PermissionType'

    UpdateTeamMember:
      type: object
      required: [userUid, permission]
      properties:
        userUid:
          type: string
        permission:
          $ref: '#/components/schemas/PermissionType'

    RemoveTeamMember:
      type: object
      required: [userUids]
      properties:
        userUids:
          type: array
          items:
            type: string

    TeamMemberInfo:
      type: object
      properties:
        userUid:
          type: string
        name:
          type: string
        userName:
          type: string
        permission:
          $ref: '#/components/schemas/PermissionType'

    TeamListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/Team'

    # ── Menu ────────────────────────────────────────────────────────────────────
    Menu:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            label:
              type: string
            path:
              type: string
            icon:
              type: string
            page:
              type: string
            pageConfig:
              type: object
              additionalProperties: true
              description: Page configuration as arbitrary JSON
            role:
              $ref: '#/components/schemas/RoleType'
            order:
              type: integer
            parentUID:
              type: string
            children:
              type: array
              items:
                $ref: '#/components/schemas/Menu'

    OrgMenuInfo:
      type: object
      required: [role]
      properties:
        menuUid:
          type: string
        role:
          $ref: '#/components/schemas/RoleType'

    # ── Datasource ──────────────────────────────────────────────────────────────
    Datasource:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            type:
              type: string
              enum: [lindb, lingo]
              description: Datasource type
            category:
              type: string
              enum: [Metric, Log, Trace]
              description: Data category
            url:
              type: string
              format: uri
            timeZone:
              type: string
            config:
              type: object
              additionalProperties: true
              description: Datasource-specific configuration as JSON
            isDefault:
              type: boolean

    # ── Dashboard ───────────────────────────────────────────────────────────────
    Dashboard:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            title:
              type: string
            description:
              type: string
            integration:
              type: string
            version:
              type: integer
            tags:
              type: array
              items:
                type: string
            isStarred:
              type: boolean

    DashboardMeta:
      type: object
      properties:
        canEdit:
          type: boolean
        provisioned:
          type: boolean

    DashboardDetail:
      type: object
      description: Dashboard with its JSON config and metadata
      properties:
        dashboard:
          type: object
          additionalProperties: true
          description: Full dashboard configuration JSON
        meta:
          $ref: '#/components/schemas/DashboardMeta'

    DashboardVersion:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            dashboardUID:
              type: string
            version:
              type: integer
            message:
              type: string
            config:
              type: object
              additionalProperties: true
              description: Dashboard configuration snapshot as JSON

    SaveDashboardRequest:
      type: object
      properties:
        dashboard:
          type: object
          additionalProperties: true
          description: Full dashboard configuration JSON
        message:
          type: string
          description: Optional commit message for version history

    DashboardListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/Dashboard'

    # ── Chart ───────────────────────────────────────────────────────────────────
    Chart:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            title:
              type: string
            description:
              type: string
            integration:
              type: string
            type:
              type: string
              description: Chart visualization type (e.g. timeseries, bar, etc.)
            version:
              type: integer
            model:
              type: object
              additionalProperties: true
              description: Chart model/config as JSON
            isStarred:
              type: boolean

    ChartInfo:
      type: object
      properties:
        uid:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        integration:
          type: string
        dashboards:
          type: integer
          description: Number of dashboards referencing this chart
        model:
          type: object
          additionalProperties: true

    ChartListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        list:
          type: array
          items:
            $ref: '#/components/schemas/ChartInfo'

    # ── Query ───────────────────────────────────────────────────────────────────
    QueryRequest:
      type: object
      properties:
        range:
          $ref: '#/components/schemas/TimeRange'
        queries:
          type: array
          items:
            $ref: '#/components/schemas/Query'

    TimeRange:
      type: object
      properties:
        start:
          oneOf:
            - type: integer
              format: int64
              description: Start time in milliseconds since epoch
            - type: string
              description: >
                Relative time expression (e.g. "now", "now-5m", "now-1h",
                "now-1d", "now-1w", "now-1M", "now-1y") or a plain integer
                string representing milliseconds since epoch
          example: "now-15m"
        end:
          oneOf:
            - type: integer
              format: int64
              description: End time in milliseconds since epoch
            - type: string
              description: >
                Relative time expression (e.g. "now", "now-5m", "now-1h",
                "now-1d", "now-1w", "now-1M", "now-1y") or a plain integer
                string representing milliseconds since epoch
          example: "now"

    Query:
      type: object
      required: [datasource]
      properties:
        datasource:
          $ref: '#/components/schemas/TargetDatasource'
        params:
          type: object
          additionalProperties: true
          description: Query parameters specific to the datasource
        refId:
          type: string
          description: Reference ID for correlating results

    TargetDatasource:
      type: object
      required: [uid]
      properties:
        uid:
          type: string
          description: Datasource UID to query

    QueryResponse:
      type: object
      properties:
        results:
          type: object
          additionalProperties: true
          description: Query results keyed by refId

    # ── Integration ─────────────────────────────────────────────────────────────
    Integration:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            category:
              type: string
            title:
              type: string
            desc:
              type: string
            icon:
              type: string
            docUrl:
              type: string
              format: uri

    # ── Boot ────────────────────────────────────────────────────────────────────
    BootData:
      type: object
      properties:
        home:
          type: string
          description: Home page path
        user:
          $ref: '#/components/schemas/SignedUser'
        navTree:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
          description: Navigation menu tree for current org
        datasources:
          type: array
          items:
            $ref: '#/components/schemas/Datasource'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/Integration'

    # ── Alerting shared ──────────────────────────────────────────────────────────
    AlertEventState:
      type: integer
      description: "Alert event lifecycle state: 1=Pending, 2=Firing, 3=Resolved, 4=NoData, 5=Error"
      enum: [1, 2, 3, 4, 5]

    MatchType:
      type: string
      description: "Label matcher operator"
      enum: ["=", "!=", "=~", "!~"]

    LabelMatcher:
      type: object
      required: [name, value, type]
      properties:
        name:
          type: string
          description: Label key to match
        value:
          type: string
          description: Match value or regex pattern
        type:
          $ref: '#/components/schemas/MatchType'

    # ── Alert Rule ───────────────────────────────────────────────────────────────
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            groupUID:
              type: string
              description: UID of the rule group this rule belongs to
            datasourceUID:
              type: string
              description: UID of the datasource used for alert evaluation
            title:
              type: string
            integration:
              type: string
            version:
              type: integer
            state:
              type: integer
              description: "Rule state: 1=Enable, 2=Running, 3=Firing, 4=Pause, 5=Delete"
              enum: [1, 2, 3, 4, 5]
            interval:
              type: integer
              format: int64
              description: Evaluation interval in nanoseconds (back-filled from group at runtime)
            for:
              type: integer
              format: int64
              description: Duration condition must hold before firing (nanoseconds). 0 = fire immediately.
            data:
              type: object
              additionalProperties: true
              description: Data query configuration as JSON
            conditions:
              type: array
              description: Alert condition expressions
              items:
                $ref: '#/components/schemas/AlertCondition'
            labels:
              type: object
              additionalProperties:
                type: string
              description: Static labels attached to all alert events from this rule
            annotations:
              type: object
              additionalProperties:
                type: string
              description: Go-template annotations (e.g. summary, description)

    AlertCondition:
      type: object
      properties:
        severity:
          type: integer
          description: "1=Alert, 2=Warning"
          enum: [1, 2]
        expr:
          type: string
          description: Boolean expression string evaluated by the expr engine

    AlertRuleListResponse:
      type: object
      description: Deprecated – use AlertRuleGroupWithRulesListResponse
      properties:
        total:
          type: integer
          format: int64
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'

    # ── Alert Rule Group schemas ──────────────────────────────────────────────
    AlertRuleGroup:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [name, interval]
          properties:
            uid:
              type: string
            name:
              type: string
              description: Group name (unique within org)
            interval:
              type: integer
              format: int64
              description: Evaluation interval shared by all rules in this group (nanoseconds)

    CreateAlertRuleGroupParam:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Group name; used as find-or-create key within the org
        interval:
          type: integer
          format: int64
          description: Required when the group does not yet exist

    CreateAlertRuleRequest:
      allOf:
        - $ref: '#/components/schemas/AlertRule'
        - type: object
          required: [group]
          properties:
            group:
              $ref: '#/components/schemas/CreateAlertRuleGroupParam'

    GroupWithRules:
      allOf:
        - $ref: '#/components/schemas/AlertRuleGroup'
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/AlertRule'

    AlertRuleGroupListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AlertRuleGroup'

    AlertRuleGroupWithRulesListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: Total number of matching groups (pagination is at group level)
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupWithRules'

    # ── Alert Rule Dry-Run ───────────────────────────────────────────────────────
    AlertRuleDryRunResult:
      type: object
      description: |
        Result of a full dry-run evaluation cycle. When a pipeline stage fails,
        `stage` and `error` are populated and other fields are absent.
        When all stages succeed, `queries` contains per-query datasource metadata,
        `dataPoints` contains all raw data points, `events` contains the alert events
        produced, and `eventResults` contains the full AlertManager pipeline trace
        per event (silences, inhibits, route matches, notification previews).
      properties:
        stage:
          type: string
          description: "Pipeline stage where the error occurred: prepare | fetch | eval"
          enum: [prepare, fetch, eval]
        error:
          type: string
          description: Error message from the failed stage
        queries:
          type: array
          description: Per-query datasource metadata and grouped data points
          items:
            $ref: '#/components/schemas/DryRunQueryInfo'
        dataPoints:
          type: array
          description: All raw data points returned by the datasource (backward compat)
          items:
            $ref: '#/components/schemas/AlertSeries'
        events:
          type: array
          description: Alert events produced by the in-memory state machine (not persisted)
          items:
            $ref: '#/components/schemas/AlertEvent'
        eventResults:
          type: array
          description: Full AlertManager pipeline trace for each alert event
          items:
            $ref: '#/components/schemas/DryRunEventResult'

    DryRunQueryInfo:
      type: object
      description: Datasource query metadata and the data points returned for a single refID
      properties:
        refID:
          type: string
        datasourceUID:
          type: string
        datasourceName:
          type: string
        datasourceType:
          type: string
        query:
          type: object
          description: Exact query parameters sent to the datasource
        timeRange:
          type: object
          description: Time range used for the query
        dataPoints:
          type: array
          description: Data points returned for this refID
          items:
            $ref: '#/components/schemas/AlertSeries'

    DryRunSilenceCheck:
      type: object
      description: Result of checking one active silence against this alert event
      properties:
        uid:
          type: string
        comment:
          type: string
        startsAt:
          type: integer
          format: int64
          description: Unix milliseconds
        endsAt:
          type: integer
          format: int64
          description: Unix milliseconds
        matchers:
          type: array
          items:
            $ref: '#/components/schemas/LabelMatcher'
        matched:
          type: boolean
          description: True when this silence suppresses the event

    DryRunInhibitCheck:
      type: object
      description: Result of checking one inhibit rule against this alert event
      properties:
        uid:
          type: string
        name:
          type: string
        sourceMatchers:
          type: array
          items:
            $ref: '#/components/schemas/LabelMatcher'
        targetMatchers:
          type: array
          items:
            $ref: '#/components/schemas/LabelMatcher'
        equalLabels:
          type: array
          items:
            type: string
        matched:
          type: boolean
          description: True when this inhibit rule suppresses the event

    DryRunChannelOutput:
      type: object
      description: Rendered notification content for one contact-point channel
      properties:
        channelUID:
          type: string
        type:
          type: string
          description: "Plugin type: Slack | Email | Webhook"
        sent:
          type: boolean
          description: True when send=true and dispatch was attempted
        error:
          type: string
        result:
          type: object
          description: Plugin-specific rendered content (structure varies by plugin type)

    DryRunRouteMatch:
      type: object
      description: One matched route and its notification preview
      properties:
        routeUID:
          type: string
        routeName:
          type: string
        contactPointUID:
          type: string
        contactPointName:
          type: string
        groupLabels:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [firing, resolved]
        channels:
          type: array
          items:
            $ref: '#/components/schemas/DryRunChannelOutput'

    DryRunEventResult:
      type: object
      description: Full AlertManager pipeline trace for one alert event
      properties:
        event:
          $ref: '#/components/schemas/AlertEvent'
        silenced:
          type: boolean
        inhibited:
          type: boolean
        silences:
          type: array
          items:
            $ref: '#/components/schemas/DryRunSilenceCheck'
        inhibits:
          type: array
          items:
            $ref: '#/components/schemas/DryRunInhibitCheck'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/DryRunRouteMatch'

    LabelMatcher:
      type: object
      description: A single label matcher (name/value pair with match type)
      properties:
        name:
          type: string
        value:
          type: string
        type:
          type: integer
          description: "0=Equal, 1=NotEqual, 2=Regexp, 3=NotRegexp"
          enum: [0, 1, 2, 3]

    AlertSeries:
      type: object
      description: A single time-series data point returned by the datasource during rule evaluation
      properties:
        refId:
          type: string
          description: Query reference ID
        metric:
          type: string
          description: Metric name
        field:
          type: string
          description: Field name within the metric
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tag/label key-value pairs
        timestamp:
          type: integer
          format: int64
          description: Unix milliseconds of the data point
        value:
          type: number
          format: double
          description: Numeric value of the data point

    # ── Alert Event ──────────────────────────────────────────────────────────────
    AlertEvent:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            ruleUID:
              type: string
            ruleTitle:
              type: string
            fingerprint:
              type: string
              description: FNV-64a hash of the label set; uniquely identifies an alert instance
            state:
              $ref: '#/components/schemas/AlertEventState'
            labels:
              type: object
              additionalProperties:
                type: string
              description: Complete label set (rule labels + series tags + system labels)
            annotations:
              type: object
              additionalProperties:
                type: string
              description: Rendered annotations
            value:
              type: number
              format: double
              description: Metric value that triggered the alert
            startsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the alert first became active (Firing)
            endsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the alert resolved; 0 if still active
            pendingSince:
              type: integer
              format: int64
              description: Unix milliseconds when the condition first became true
            notifiedAt:
              type: integer
              format: int64
              description: Unix milliseconds of the last notification sent
            generatorURL:
              type: string
              description: URL linking back to the triggering query

    AlertEventListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvent'

    # ── Alert Route ──────────────────────────────────────────────────────────────
    AlertRoute:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            parentUID:
              type: string
              description: UID of the parent route node; empty string identifies the root route, which is auto-created when the org is initialized and cannot be created via API
            matchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: All matchers must match for this route to apply
            contactPointUID:
              type: string
              description: UID of the contact point to send notifications to
            continue:
              type: boolean
              description: If true, continue matching sibling routes after this one matches
            groupBy:
              type: array
              items:
                type: string
              description: Label names used to group alerts into notification batches
            groupWait:
              type: integer
              format: int64
              description: Wait duration (nanoseconds) before sending the first notification for a new group. Default 30s.
            groupInterval:
              type: integer
              format: int64
              description: Wait duration (nanoseconds) before sending a notification for a group with new alerts. Default 5m.
            repeatInterval:
              type: integer
              format: int64
              description: Wait duration (nanoseconds) before re-sending a notification for unchanged alerts. Default 4h.
            sortOrder:
              type: integer
              description: Route evaluation priority (lower = higher priority)

    AlertRouteNode:
      allOf:
        - $ref: '#/components/schemas/AlertRoute'
        - type: object
          properties:
            routes:
              type: array
              description: Ordered child route nodes; evaluated in sort_order after the parent matches
              items:
                $ref: '#/components/schemas/AlertRouteNode'

    AlertRouteListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        routes:
          type: array
          items:
            $ref: '#/components/schemas/AlertRoute'

    CreateAlertRouteRequest:
      allOf:
        - $ref: '#/components/schemas/AlertRoute'
        - type: object
          properties:
            refUID:
              type: string
              description: UID of the sibling reference node; when set, the new route is inserted relative to this node.
            position:
              type: string
              enum: [before, after]
              description: Insertion position relative to refUID. "before" inserts at refUID's sort_order; "after" inserts one position later. Ignored when refUID is empty.

    # ── Contact Point ─────────────────────────────────────────────────────────────
    NotificationChannel:
      type: object
      required: [type, enabled]
      properties:
        uid:
          type: string
          description: Stable per-channel identifier; auto-generated by the service on create/update. Used as the unique key for ContactPointStatus.
        type:
          type: string
          description: Channel type
          enum: [Slack, Email, Webhook]
        config:
          type: object
          additionalProperties: true
          description: Channel-specific configuration as JSON (e.g. channel name for Slack, addresses for Email)
        enabled:
          type: boolean
          description: Whether this channel is active

    ContactPoint:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            channels:
              type: array
              items:
                $ref: '#/components/schemas/NotificationChannel'
              description: One or more notification channels sent simultaneously

    ContactPointListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        contactPoints:
          type: array
          items:
            $ref: '#/components/schemas/ContactPointVO'

    ChannelStatusVO:
      type: object
      description: >
        Per-channel delivery health enrichment returned by the contact-point list.
        Each entry is keyed by the channel's stable UID (channel.uid), so multiple
        channels of the same type within one contact point each get their own status record.
      properties:
        type:
          type: string
          description: Notifier plugin type (e.g. "Email", "Slack", "Webhook")
        enabled:
          type: boolean
          description: Whether this channel is active
        summary:
          type: string
          description: Primary config value shown in the list (e.g. webhook URL, recipient addresses, Slack channel)
        status:
          type: string
          enum: [ok, error, unknown]
          description: Last delivery status; "unknown" means the channel has never been used
        lastSentAt:
          type: integer
          format: int64
          description: Unix timestamp (ms) of the last delivery attempt; omitted when never sent
        durationMs:
          type: integer
          format: int64
          description: Round-trip delivery duration in milliseconds; omitted when never sent
        errorMsg:
          type: string
          description: Error detail; populated only when status is "error"

    ContactPointVO:
      description: >
        A ContactPoint enriched with per-channel delivery health information.
        Returned by the search/list endpoint.
      allOf:
        - $ref: '#/components/schemas/ContactPoint'
        - type: object
          properties:
            channelStatus:
              type: array
              items:
                $ref: '#/components/schemas/ChannelStatusVO'
              description: Health and summary for each channel; one entry per channel in the channels array

    NotifierPlugin:
      type: object
      description: Metadata for a registered notifier plugin.
      properties:
        type:
          type: string
          description: Unique plugin type identifier (e.g. "Email", "Slack")
        displayName:
          type: string
          description: Human-readable name shown in the UI
        description:
          type: string
          description: Short description of what this notifier does
        configSchema:
          type: object
          description: >
            Complete form-schema definition for this plugin's configuration form.
            Uses either {"fields": [...]} for a flat form or {"sections": [...]} for grouped fields.

    # ── Alert Silence ────────────────────────────────────────────────────────────
    AlertSilence:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [matchers, startsAt, endsAt, comment]
          properties:
            uid:
              type: string
            matchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: All matchers must match for an alert to be silenced
            startsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the silence begins
            endsAt:
              type: integer
              format: int64
              description: Unix milliseconds when the silence expires
            createdByName:
              type: string
              description: Name of the user who created this silence
            comment:
              type: string
              description: Reason for the silence (required)
            state:
              type: string
              enum: [pending, active, expired]
              description: |
                Computed lifecycle state (not persisted):
                pending = startsAt > now; active = startsAt <= now < endsAt; expired = endsAt <= now

    AlertSilenceListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        silences:
          type: array
          items:
            $ref: '#/components/schemas/AlertSilence'

    # ── Alert Inhibit Rule ───────────────────────────────────────────────────────
    AlertInhibitRule:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            sourceMatchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: Matchers that identify the source (triggering) alert
            targetMatchers:
              type: array
              items:
                $ref: '#/components/schemas/LabelMatcher'
              description: Matchers that identify the target (suppressed) alert
            equalLabels:
              type: array
              items:
                type: string
              description: Source and target alerts must share the same values for these labels
            enabled:
              type: boolean

    AlertInhibitRuleListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AlertInhibitRule'

    # ── Notification Template ────────────────────────────────────────────────────
    NotificationTemplate:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [name, template]
          properties:
            uid:
              type: string
            name:
              type: string
            template:
              type: string
              description: |
                Go template string. Available variables:
                  .Alerts, .FiringAlerts, .ResolvedAlerts – alert event lists
                  .CommonLabels, .CommonAnnotations – shared label/annotation maps
                  .GroupLabels – labels used to form this notification group
                  .ReceiverName – name of the target receiver
                  .Status – "firing" or "resolved"
                  .ExternalURL – base URL for generating links

    NotificationTemplateListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        templates:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplate'

    # ── Notification Template Example ────────────────────────────────────────────
    NotificationTemplateExample:
      type: object
      required: [name, payload]
      properties:
        name:
          type: string
        isDefault:
          type: boolean
          description: >
            When true, this example is automatically used as the preview payload
            when no explicit payload is provided in a preview request.
        payload:
          type: string
          description: |
            JSON-serialised NotificationData used as template render context.
            Matches the shape of NotificationData:
              alerts, firingAlerts, resolvedAlerts – alert event arrays
              commonLabels, commonAnnotations, groupLabels – string maps
              receiverName, status, externalURL – string fields
            FiringAlerts/ResolvedAlerts are auto-derived from Alerts by state when omitted.

    NotificationTemplateExampleListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        examples:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplateExample'

    # ── Notification Setting ─────────────────────────────────────────────────────
    NotificationSetting:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              description: Channel type identifier (e.g. Slack, Email)
            config:
              type: object
              additionalProperties: true
              description: Channel-specific global configuration as JSON (e.g. Slack bot token, SMTP credentials)

    # ── Agent ────────────────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: The user's plain-text message.

    AGUIEvent:
      type: object
      description: >
        A single AG-UI protocol event frame. The `type` field determines which other fields are present.
        Streaming chat produces a sequence of events; history restore returns a single MESSAGES_SNAPSHOT event.
      properties:
        type:
          type: string
          enum:
            - RUN_STARTED
            - RUN_FINISHED
            - RUN_ERROR
            - TEXT_MESSAGE_START
            - TEXT_MESSAGE_CONTENT
            - TEXT_MESSAGE_END
            - TOOL_CALL_START
            - TOOL_CALL_ARGS
            - TOOL_CALL_END
            - TOOL_CALL_RESULT
            - MESSAGES_SNAPSHOT
          description: Identifies the kind of AG-UI event frame.
        runId:
          type: string
          description: Unique ID for the current agent run (present on RUN_STARTED, RUN_FINISHED, RUN_ERROR).
        conversationUid:
          type: string
          description: Conversation UID (present on RUN_STARTED and RUN_FINISHED).
        title:
          type: string
          description: Auto-generated conversation title (RUN_FINISHED, new conversations only).
        id:
          type: string
          description: AG-UI message ID (present on TEXT_MESSAGE_* and TOOL_CALL_RESULT).
        status:
          type: string
          enum: [processing, streaming, complete, error]
          description: >
            Lifecycle state of the message referenced by id.
            streaming → TEXT_MESSAGE_START; complete → TEXT_MESSAGE_END or TOOL_CALL_RESULT;
            processing → TOOL_CALL_START. Omitted for events that do not change message state.
        role:
          type: string
          description: Message role — user, assistant, tool (present on TEXT_MESSAGE_START).
        delta:
          type: string
          description: Incremental text chunk (present on TEXT_MESSAGE_CONTENT).
        toolCallId:
          type: string
          description: Correlates TOOL_CALL_START / TOOL_CALL_ARGS / TOOL_CALL_END / TOOL_CALL_RESULT for one invocation.
        toolCallName:
          type: string
          description: Name of the tool being called (present on TOOL_CALL_START and TOOL_CALL_RESULT).
        parentMessageId:
          type: string
          description: Assistant message ID that triggered this tool call (present on TOOL_CALL_START).
        content:
          type: string
          description: Full tool result content (present on TOOL_CALL_RESULT).
        guidance:
          $ref: '#/components/schemas/AGUIGuidance'
        code:
          type: string
          enum: [rate_limit, model_not_configured, internal_error]
          description: >
            Machine-readable error code (present on RUN_ERROR).
            rate_limit → retry later; model_not_configured → redirect admin to AI Settings → Models;
            internal_error → generic retry prompt.
        message:
          type: string
          description: Human-readable error description (present on RUN_ERROR).
        messages:
          type: array
          description: Full message list (present on MESSAGES_SNAPSHOT only).
          items:
            $ref: '#/components/schemas/AGUIMessage'
        outcome:
          type: string
          enum: [complete, interrupt]
          description: >
            Why the run ended (present on RUN_FINISHED). Omitted value is equivalent to
            `complete`. `interrupt` means the agent paused waiting for human approval of one
            or more tool calls; the `interrupt` field then carries the pending calls.
        interrupt:
          $ref: '#/components/schemas/AGUIInterruptPayload'

    AGUIInterruptPayload:
      type: object
      description: >
        Pending tool calls that triggered an interrupt, embedded in a RUN_FINISHED event
        with outcome=interrupt. On history replay the same payload is returned so the frontend
        renders approval cards; `status` reflects the current resolution state.
      properties:
        interruptId:
          type: string
          description: Server-generated interrupt ID; the client echoes it back when resuming.
        status:
          type: string
          enum: [pending, approved, rejected, expired]
          description: >
            Interrupt lifecycle state. Omitted on the live SSE frame (always pending at emit
            time); populated on history replay so resolved interrupts render as non-actionable.
        toolCalls:
          type: array
          description: Tool invocations waiting for approval.
          items:
            $ref: '#/components/schemas/AGUIPendingToolCall'

    AGUIPendingToolCall:
      type: object
      description: A single tool invocation awaiting human approval.
      properties:
        id:
          type: string
          description: Tool call ID assigned by the LLM; echoed back in the resume request.
        name:
          type: string
          description: Tool function name.
        arguments:
          type: string
          description: JSON-encoded argument string produced by the LLM.
        cardType:
          type: string
          description: Frontend component hint for rendering the approval card (e.g. alert_rule_card).

    AGUIMessage:
      type: object
      description: Unified message format used in both streaming events and MESSAGES_SNAPSHOT history.
      properties:
        id:
          type: string
          description: Stable AG-UI message ID (same as the `id` field in streaming events).
        role:
          type: string
          description: Message role — user, assistant, error.
        status:
          type: string
          enum: [processing, streaming, complete, error]
          description: >
            Message lifecycle state.
            processing → tool invoked, waiting for result;
            streaming → LLM actively emitting text deltas;
            complete → message fully formed and persisted;
            error → agent-side failure.
        content:
          type: string
          description: Plain-text content of the message.
        delta:
          type: string
          description: Incremental text delta during streaming phase (SSE only; empty in history).
        toolCalls:
          type: array
          description: Tool call requests attached to an assistant message.
          items:
            $ref: '#/components/schemas/AGUIToolCall'
        toolCallId:
          type: string
          description: Correlates a tool-result message with the assistant tool_call request.
        name:
          type: string
          description: Name of the tool that produced this message (tool messages only).
        createdAt:
          type: integer
          format: int64
          description: Unix millisecond timestamp when the message was persisted.

    AGUIToolCall:
      type: object
      description: A single tool invocation in an assistant message.
      properties:
        id:
          type: string
          description: Tool call ID assigned by the LLM.
        name:
          type: string
          description: Tool function name.
        arguments:
          type: string
          description: JSON-encoded argument string produced by the LLM.
        extra:
          $ref: '#/components/schemas/AGUIGuidance'

    AGUIGuidance:
      type: object
      description: >
        Structured render hint attached to a tool result.
        Tells the frontend which rich component to use and provides the unmodified
        structured payload for that component.
      properties:
        render_type:
          type: string
          description: >
            Suggested frontend component: "table" for query results, "list" for enumeration results,
            "text" for plain output.
        raw_data:
          description: >
            Clean, unmodified structured payload for rich rendering.
            Omitted when the tool result is plain text.

    AgentConversation:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            orgId:
              type: integer
              format: int64
            userId:
              type: integer
              format: int64
            title:
              type: string

    ConversationListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/AgentConversation'

    FeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          format: int8
          enum: [1, -1]
          description: "1 = thumbs up, -1 = thumbs down"
        reasons:
          type: array
          items:
            type: string
            enum:
              - tool_call_error
              - hallucination
              - bad_format
              - outdated_info
              - incomplete
              - off_topic
              - logic_perfect
              - helpful
              - concise
          description: Predefined reason tags for the rating
        comment:
          type: string
          description: Free-text qualitative feedback
        correctedContent:
          type: string
          description: User's manual rewrite of the assistant message (gold annotation for SFT/DPO)

    MessageFeedback:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            conversationUid:
              type: string
            messageUid:
              type: string
            rating:
              type: integer
              format: int8
              enum: [1, -1]
            reasons:
              type: array
              items:
                type: string
            comment:
              type: string
            correctedContent:
              type: string

    AgentModel:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            orgId:
              type: integer
              format: int64
            name:
              type: string
              description: Human-readable name for this model configuration.
            provider:
              type: string
              description: LLM provider identifier (e.g. openai).
            model:
              type: string
              description: Model name (e.g. gpt-4o).
            baseUrl:
              type: string
              description: Optional base URL override for the provider API.
            maxTokens:
              type: integer
            temperature:
              type: number
              format: float
            isDefault:
              type: boolean
              description: True when this model is the default for fixed-mode routing.
            isEnabled:
              type: boolean
              description: True when this model participates in auto-mode routing.
            priority:
              type: integer
              description: Failover sort order — lower value is tried first.
            costWeight:
              type: integer
              description: Cost sort order — lower value is cheaper.
            tags:
              type: string
              description: Comma-separated capability labels (e.g. "code,vision").

    AgentOrgModelConfig:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            orgId:
              type: integer
              format: int64
            selectionMode:
              type: string
              enum: [fixed, auto]
              description: '"fixed" uses the default model; "auto" applies a strategy.'
            autoStrategy:
              type: string
              enum: [failover, cost, round_robin, capability]
              description: Strategy used when selectionMode is "auto".

    CreateModelRequest:
      $ref: '#/components/schemas/ModelRequest'

    UpdateModelRequest:
      $ref: '#/components/schemas/ModelRequest'

    ModelRequest:
      type: object
      description: >
        Unified request body for POST /ai/models and PUT /ai/models/:uid.
        Required fields (name, provider, model, apiKey) are enforced by the
        service layer; they are required on create but optional on update.
      properties:
        name:
          type: string
        provider:
          type: string
        model:
          type: string
        apiKey:
          type: string
          writeOnly: true
          description: >
            API key for the LLM provider. On update, omitting this field (or
            sending an empty string) leaves the stored key unchanged.
        isDefault:
          type: boolean
          description: >
            When true, this model is promoted to the org default atomically
            after the create/update operation completes.
        baseUrl:
          type: string
        maxTokens:
          type: integer
        temperature:
          type: number
          format: float
        isEnabled:
          type: boolean
        priority:
          type: integer
        costWeight:
          type: integer
        tags:
          type: string

    SaveOrgModelConfigRequest:
      type: object
      required: [selectionMode]
      properties:
        selectionMode:
          type: string
          enum: [fixed, auto]
        autoStrategy:
          type: string
          enum: [failover, cost, round_robin, capability]

    AgentMCPServer:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            uid:
              type: string
            orgId:
              type: integer
              format: int64
            name:
              type: string
            type:
              type: string
              enum: [sse, stdio]
              description: MCP server transport type.
            url:
              type: string
              description: SSE endpoint URL (type=sse).
            command:
              type: string
              description: Executable path (type=stdio).
            args:
              type: string
              description: Space-separated command arguments (type=stdio).
            enabled:
              type: boolean

    UpdateConversationTitleRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: New title for the conversation.

    CreateMCPServerRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [sse, stdio]
        url:
          type: string
        command:
          type: string
        args:
          type: string
        enabled:
          type: boolean
