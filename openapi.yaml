  # ── AI: Model CRUD ─────────────────────────────────────────────────────────
  /api/v1/ai/conversations/{uid}/messages/{messageUID}/feedback:
    put:
      tags: [AIConversations]
      operationId: upsertMessageFeedback
      summary: Submit or update feedback for a message
      description: |
        Creates or replaces the feedback for one assistant message.
        Only the conversation owner may write feedback.
        Supports thumbs-up/thumbs-down rating, predefined reason tags,
        free-text comment, and an optional manual correction (gold annotation
        for SFT/DPO fine-tuning pipelines).
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: Conversation UID
        - name: messageUID
          in: path
          required: true
          schema:
            type: string
          description: Message UID (AG-UI messageId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '200':
          description: The persisted feedback record
