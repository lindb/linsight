          in: query
          schema:
            type: string
          description: Filter by alert rule UID
        - name: state
          in: query
          schema:
            type: integer
            description: "1=Pending, 2=Firing, 3=Resolved, 4=NoData, 5=Error"
            enum: [1, 2, 3, 4, 5]
      responses:
        '200':
          description: Paginated list of alert events
