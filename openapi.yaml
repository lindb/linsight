  # ─── Alert Rules ──────────────────────────────────────────────────────────────
  /api/v1/alerting/rules:
    get:
      tags: [AlertRules]
      summary: Search alert rules (Viewer)
      description: Search alert rules grouped by rule group. Supports filters by title, group name, and datasource UID. Requires Viewer role.
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: title
          in: query
          schema:
            type: string
        - name: groupName
          in: query
          schema:
            type: string
          description: Filter by group name prefix
        - name: datasourceUID
          in: query
          schema:
            type: string
          description: Filter by datasource UID
      responses:
        '200':
          description: Paginated list of rule groups (each group contains its matching rules)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleGroupWithRulesListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [AlertRules]
      summary: Create alert rule (Editor)
      description: Create a new alert rule. The group is looked up by name; if not found it is created automatically using the provided interval. Requires Editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRuleRequest'
      responses:
        '200':
          description: Alert rule created – returns new UID
          content:
            application/json:
              schema:
                type: string
                description: New alert rule UID
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [AlertRules]
      summary: Update alert rule (Editor)
      description: Update an existing alert rule. Requires Editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
      responses:
        '200':
          description: Alert rule updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerting/rules/dry-run:
    post:
      tags: [AlertRules]
      summary: Dry-run alert rule evaluation (Editor)
      description: |
        Executes the full evaluation pipeline (prepare → fetch → eval → silence → inhibit → route → notify)
        for the given rule without persisting any state. By default notifications are NOT dispatched.
        Pass `?send=true` to also deliver real notifications to the configured contact points.
        Pipeline errors are returned inside the response body (stage + error fields)
        rather than as HTTP error codes so the caller always receives a structured result.
        Requires Editor role.
      parameters:
        - name: send
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, dispatch real notifications to contact point targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
      responses:
        '200':
          description: Dry-run result (check stage/error fields for pipeline failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleDryRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerting/rules/{uid}:
      description: Returns a single alert rule by UID. Requires Viewer role.
      parameters:
        - $ref: '#/components/parameters/UIDPath'
      responses:
        '200':
          description: Alert rule detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [AlertRules]
      summary: Delete alert rule by UID (Editor)
      description: Delete an alert rule by UID. Requires Editor role.
      parameters:
        - $ref: '#/components/parameters/UIDPath'
      responses:
        '200':
          description: Alert rule deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

