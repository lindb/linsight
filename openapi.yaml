  # ─── Alert Routes ─────────────────────────────────────────────────────────────
  /api/v1/alerting/routes:
    get:
      tags: [AlertRoutes]
      summary: Get alert route tree (Viewer)
      description: Returns the nested routing tree for the current organization. The tree root has parentUID="". Returns null when no root route has been created yet. Requires Viewer role.
      responses:
        '200':
          description: Alert routing tree root node (null when no default route exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRouteNode'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [AlertRoutes]
      summary: Create alert route (Editor)
      description: >
        Create a new route node. When `refUID` and `position` are provided,
        the new node is inserted as a sibling before or after the referenced
        node; otherwise it is appended with default sort_order. Requires Editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRouteRequest'
      responses:
        '200':
          description: Alert route created – returns new UID
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [AlertRoutes]
      summary: Update alert route (Editor)
      description: Update an existing route node. Requires Editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRoute'
      responses:
        '200':
          description: Alert route updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

